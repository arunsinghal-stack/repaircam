# RepairCam storage — copy this file to storage.yaml to change any of it.
#
#     cp repaircam/storage.example.yaml repaircam/storage.yaml
#
# WITHOUT this file everything below still applies at its default. The
# free-space guard is not something you switch on: it is what stops a repair
# being half-recorded onto a full disk.
#
# Rough sizing: one bench recording for one hour is about 1.8 GB.

storage:
  # Recording is REFUSED below this. About eleven bench-hours, so a bench that
  # is allowed to start a repair has room to finish it.
  min_free_gb: 20

  # Still recording, but the dashboard says space is running out.
  warn_free_gb: 50

  # Where the second copy goes — a USB/archive disk or a mounted NAS share.
  # LEAVE EMPTY and there is no second copy: the shop's only recording of every
  # repair sits on this one laptop, and nothing is ever deleted either.
  #
  # Examples:
  #   archive_dir: "/mnt/repaircam-archive"
  #   archive_dir: "/media/user/ARCHIVE-HDD/repaircam"
  archive_dir: ""

  # ------------------------------------------------------------------------
  # TWO WINDOWS. They are not the same thing, and mixing them up is how a
  # recorder fills on a Wednesday.
  #
  #   keep_days_local        how long THIS LAPTOP keeps its copy.  Arithmetic.
  #   keep_days_by_source    how long the ARCHIVE keeps it.        Policy.
  #
  # The recorder's number is not a choice. Three benches at eight recorded
  # hours is about 43 GB a day, so a 200 GB laptop holds five days — putting 30
  # here would need 1.3 TB. The disk would simply fill, the free-space guard
  # would refuse Start, and nothing would be old enough to delete.
  # ------------------------------------------------------------------------

  # How long a clip stays on the RECORDER after it has been copied to the
  # archive and the copy verified. One number for everything: how much disk
  # this machine has does not depend on what the footage is of.
  #
  # Nothing is lost when this expires. The archive still has the clip and the
  # links in Odoo still play it — RepairCam falls back to the archive.
  #
  # Clips that were never archived are never removed, whatever their age.
  keep_days_local: 7

  # How long the ARCHIVE keeps a clip — the shop's real retention policy, and
  # the point at which the footage stops existing.
  #
  # This is the fallback, and what a recording started by hand in RepairCam
  # gets — it belongs to no integration, so no integration's window fits it.
  keep_days: 30

  # Retention really depends on what the footage is OF, so it is set per source.
  # A repair can be argued about for as long as it is under warranty; a packing
  # complaint — "the box was short an item" — arrives inside the delivery and
  # return window instead. One number would be wrong for both.
  #
  # Set to this shop's own windows. Getting these WRONG in the short direction
  # cannot be undone: the footage is gone, and it is gone for exactly the jobs
  # old enough that somebody is now arguing about them.
  keep_days_by_source:
    repair: 30
    packing: 45

  # -- the two switches ----------------------------------------------------
  #
  # Separate on purpose. They are different acts: the first frees this laptop
  # and loses nothing, the second ends the footage.

  # Remove the recorder's copy once it is archived and older than
  # keep_days_local. Safe: a verified second copy exists, and it is re-checked
  # at the moment of deletion.
  #
  # Before setting this true, look in archive_dir and satisfy yourself the clips
  # are really there and really play.
  delete_after_archive: false

  # Remove footage from the ARCHIVE once its window has passed. THIS IS THE ONE
  # THAT CANNOT BE UNDONE — there is no third copy behind it.
  #
  # Leave it false and the archive never shrinks: about 950 GB a month at three
  # busy benches, for ever. Turn it on when the archive is the size you can
  # live with, and mark anything worth keeping with "Keep this clip" first —
  # kept clips are never deleted, by either switch.
  delete_from_archive: false
