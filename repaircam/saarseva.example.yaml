# saar-seva auto-trigger — copy this file to saarseva.yaml to switch it on.
#
#     cp repaircam/saarseva.example.yaml repaircam/saarseva.yaml
#
# saarseva.yaml holds a real API token and is gitignored. NEVER commit it.
#
# While this file does not exist, the auto-trigger is simply OFF and technicians
# start and stop recordings themselves in the web UI. Everything still works.
#
# NOTE: the two endpoints below do not exist in saar-seva yet. Until they are
# built, turning this on will only fill the log with "404 does not exist on the
# server yet". See docs/PHASE5-CONTRACT.md.

saarseva:
  # Where saar-seva's backend lives.
  base_url: "https://saar-seva-api-staging.onrender.com"

  # Service token for the recorder — NOT a technician's login.
  api_key: "CHANGE-ME"

  # This recorder's address on the shop network. It goes into the Odoo MO
  # chatter as the link to the video, so it must be reachable from a shop
  # computer. Find it with:  hostname -I
  link_base: "http://192.168.0.50:8080"

  # How often to ask saar-seva what is running. 5s is responsive without being
  # rude to a sleeping Render instance.
  poll_seconds: 5

  # Only these benches are auto-triggered. Leave empty for every bench in
  # cameras.yaml. Benches with no camera should not be listed.
  work_centers: ["WC2"]

  # Set to false to keep the settings but stop polling.
  enabled: true
